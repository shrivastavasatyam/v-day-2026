<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will You Be My Valentine? 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 90%;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      height: 80px;
    }

    button {
      font-size: 1.1rem;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      margin-right: 20px;
    }

    #noBtn {
      background-color: #ccc;
      color: #333;
      position: fixed;   /* key: floats over everything */
      z-index: 9999;     /* key: always on top */
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    .success {
      display: none;
    }

    .success h1 {
      color: #ff4d6d;
    }
  </style>
</head>
<body>
  <div class="card" id="mainCard">
    <h1> 💖 Hey Somya 💖</h1>
    <p>Will you be my Valentine?</p>
    <p style="font-size: 0.95rem; opacity: 0.7; margin-top: -10px;">
      (please don’t click No 😅)
    </p>
    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😐</button>
    </div>
  </div>

  <div class="card success" id="successCard">
    <h1> ❤️😈 YOU ARE TRAPPED FOREVER HAHAHAHA 😈❤️ </h1>
    <p>😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘</p>
    <p>😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘</p>
    <p>😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘</p>
    <p>😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘😘</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const mainCard = document.getElementById("mainCard");
    const successCard = document.getElementById("successCard");

    let dodgeCount = 0;
    const maxDodges = 8;

    // Define 4 screen corners
    function getCorners() {
      return [
        { x: 20, y: 20 }, // top-left
        { x: window.innerWidth - noBtn.offsetWidth - 20, y: 20 }, // top-right
        { x: 20, y: window.innerHeight - noBtn.offsetHeight - 20 }, // bottom-left
        { x: window.innerWidth - noBtn.offsetWidth - 20, y: window.innerHeight - noBtn.offsetHeight - 20 } // bottom-right
      ];
    }

    function moveNoButton() {
      const corners = getCorners();
      const corner = corners[Math.floor(Math.random() * corners.length)];
      noBtn.style.left = corner.x + "px";
      noBtn.style.top = corner.y + "px";
    }

    // Initial position (bottom-right corner)
    moveNoButton();

    // Make it run away when the cursor gets close
    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;

      const distX = e.clientX - btnCenterX;
      const distY = e.clientY - btnCenterY;
      const distance = Math.sqrt(distX * distX + distY * distY);

      if (distance < 120 && dodgeCount < maxDodges) {
        moveNoButton();
        dodgeCount++;

        if (dodgeCount >= maxDodges) {
          // Turn No into Yes 😈
          noBtn.textContent = "Yes 💖";
          noBtn.style.backgroundColor = "#ff4d6d";
          noBtn.style.color = "white";
        }
      }
    });

    function showSuccess() {
      mainCard.style.display = "none";
      successCard.style.display = "block";
    }

    yesBtn.addEventListener("click", showSuccess);
    noBtn.addEventListener("click", () => {
      if (dodgeCount >= maxDodges) {
        showSuccess();
      }
    });
  </script>
</body>
</html>
